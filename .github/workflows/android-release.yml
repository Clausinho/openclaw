name: Android APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional release tag (e.g. v2026.5.16-android)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_VARIANT: thirdPartyRelease
      KEYSTORE_PATH: ${{ github.workspace }}/apps/android/release-keystore.jks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Decode signing keystore
        shell: bash
        env:
          OPENCLAW_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENCLAW_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OPENCLAW_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$OPENCLAW_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Write Gradle signing properties
        shell: bash
        env:
          OPENCLAW_ANDROID_STORE_PASSWORD: ${{ secrets.OPENCLAW_ANDROID_STORE_PASSWORD }}
          OPENCLAW_ANDROID_KEY_ALIAS: ${{ secrets.OPENCLAW_ANDROID_KEY_ALIAS }}
          OPENCLAW_ANDROID_KEY_PASSWORD: ${{ secrets.OPENCLAW_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          OPENCLAW_ANDROID_STORE_FILE=$KEYSTORE_PATH
          OPENCLAW_ANDROID_STORE_PASSWORD=$OPENCLAW_ANDROID_STORE_PASSWORD
          OPENCLAW_ANDROID_KEY_ALIAS=$OPENCLAW_ANDROID_KEY_ALIAS
          OPENCLAW_ANDROID_KEY_PASSWORD=$OPENCLAW_ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed third-party release APK
        run: |
          cd apps/android
          ./gradlew :app:assembleThirdPartyRelease

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find "$GITHUB_WORKSPACE/apps/android/app/build/outputs/apk/thirdParty/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$apk_path"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Generate version tag
        id: version
        shell: bash
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION_TAG" ]; then
            tag="$INPUT_VERSION_TAG"
          else
            tag="v$(date -u +%Y.%m.%d)-android-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenClaw Android ${{ steps.version.outputs.tag }}
          body: |
            Automated signed Android sideload build from commit ${{ github.sha }}.

            - Variant: `${{ env.APK_VARIANT }}`
            - Asset: `${{ steps.apk.outputs.name }}`

            **Install via Obtainium**
            Point Obtainium at this repository's releases and install the attached APK.
          draft: false
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
